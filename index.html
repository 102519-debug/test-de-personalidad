<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué tan mal me caes?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1edff;
  --card: #ffffff;
  --ink: #1f1a3d;
  --muted: #6a6492;
  --line: #d9d2f5;
  --accent: #e5265f;
  --accent-ink: #ffffff;
  --good: #1fa97a;
  --pick: #ffe9a8;
  --display: "Bricolage Grotesque", "Trebuchet MS", "Arial Black", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122b;
    --card: #221e42;
    --ink: #f1edff;
    --muted: #aaa4d2;
    --line: #3a3566;
    --accent: #ff4f81;
    --accent-ink: #1b0612;
    --good: #3ddc97;
    --pick: #4a3d12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15122b;
  --card: #221e42;
  --ink: #f1edff;
  --muted: #aaa4d2;
  --line: #3a3566;
  --accent: #ff4f81;
  --accent-ink: #1b0612;
  --good: #3ddc97;
  --pick: #4a3d12;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  min-height: 100vh;
}
main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.02; margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.6rem, 11vw, 3.8rem); }
h2 { font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.12; }
p { margin: 0; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.btn {
  display: inline-block;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: 999px;
  padding: 14px 30px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.1rem;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }

/* Gauge */
.gauge { width: 100%; max-width: 380px; margin: 0 auto; display: block; }
.gauge-labels { display: flex; justify-content: space-between; max-width: 380px; margin: -6px auto 0; font-weight: 600; font-size: .9rem; color: var(--muted); }
.needle { transform-box: view-box; transform-origin: 150px 150px; }
.needle line { stroke: var(--ink); }
.needle circle { fill: var(--ink); }
.hero-needle { animation: sweep 2.4s cubic-bezier(.3,.7,.3,1) both; }
@keyframes sweep {
  0%   { transform: rotate(-90deg); }
  50%  { transform: rotate(48deg); }
  72%  { transform: rotate(-22deg); }
  88%  { transform: rotate(8deg); }
  100% { transform: rotate(0deg); }
}
.result-needle { transform: rotate(-90deg); transition: transform 1.8s cubic-bezier(.2,1.25,.4,1); }

/* Start */
.start p.lead { margin: 18px 0 26px; font-size: 1.15rem; max-width: 34ch; }
.field { display: block; margin-bottom: 20px; }
.field span { display: block; font-weight: 600; margin-bottom: 6px; }
.field input {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 13px 16px;
}
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: transparent; }

/* Quiz */
.progress { display: flex; gap: 5px; margin-bottom: 26px; }
.progress i { flex: 1; height: 7px; border-radius: 4px; background: var(--line); }
.progress i.done { background: var(--accent); }
.progress i.now { background: var(--ink); }
.qtext { margin-bottom: 22px; }
.options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.opt {
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 15px 18px;
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover { border-color: var(--ink); }
.opt.picked { border-color: var(--ink); background: var(--pick); }
.back { margin-top: 20px; background: none; border: 0; color: var(--muted); font-weight: 600; padding: 6px 0; }
.back:hover { color: var(--ink); }

/* Result */
.pct { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 20vw, 6.5rem); line-height: 1; text-align: center; margin-top: 4px; letter-spacing: -0.04em; }
.pct small { font-size: .45em; }
.verdict { text-align: center; margin: 6px 0 12px; }
.roast { text-align: center; max-width: 40ch; margin: 0 auto 28px; }
.flags { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 14px; }
.flags h3 { font-family: var(--display); font-size: 1.1rem; margin: 0 0 8px; }
.flags ul { margin: 0; padding-left: 1.1em; }
.flags li { margin: 6px 0; }
.flags li b { font-weight: 600; }
.flags.red { border-color: var(--accent); }
.flags.green { border-color: var(--good); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
.status { text-align: center; min-height: 1.5em; margin-top: 12px; color: var(--muted); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .hero-needle { animation: none; }
  .result-needle { transition: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>
<main>

  <!-- INICIO -->
  <section id="start" class="start">
    <div id="heroGauge"></div>
    <div class="gauge-labels" aria-hidden="true"><span>Te adoro</span><span>No te aguanto</span></div>
    <h1 style="margin-top:22px">¿Qué tan mal me caes?</h1>
    <p class="lead">Diez situaciones de la vida real. Contesta con honestidad: según qué tan buena o mala persona seas, la aguja decide.</p>
    <label class="field">
      <span>¿Cómo te llamas?</span>
      <input id="nameInput" type="text" maxlength="30" autocomplete="given-name" placeholder="Tu nombre (opcional)">
    </label>
    <button class="btn" id="startBtn" type="button">Empezar el test</button>
  </section>

  <!-- PREGUNTAS -->
  <section id="quiz" hidden>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="1" aria-valuemax="10" aria-label="Progreso del test"></div>
    <h2 class="qtext" id="qtext" tabindex="-1"></h2>
    <ul class="options" id="options"></ul>
    <button class="back" id="backBtn" type="button">← Pregunta anterior</button>
  </section>

  <!-- RESULTADO -->
  <section id="result" hidden>
    <div id="resultGauge"></div>
    <div class="gauge-labels" aria-hidden="true"><span>Te adoro</span><span>No te aguanto</span></div>
    <div class="pct" id="pct" aria-live="polite">0<small>%</small></div>
    <h2 class="verdict" id="verdict" tabindex="-1"></h2>
    <p class="roast" id="roast"></p>
    <div class="flags red" id="redFlags" hidden>
      <h3>Lo que más me hizo dudar</h3>
      <ul id="redList"></ul>
    </div>
    <div class="flags green" id="greenFlags" hidden>
      <h3>Lo que te salvó</h3>
      <ul id="greenList"></ul>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copiar mi resultado</button>
      <button class="btn ghost" id="retryBtn" type="button">Hacer el test otra vez</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

</main>

<script>
(function () {
  "use strict";

  // Cada respuesta: [texto, puntos de maldad 0-3]
  var QUESTIONS = [
    { tag: "La cartera", q: "Encuentras una cartera con $2,000 pesos y la identificación del dueño.", a: [
      ["La llevo a su casa hoy mismo", 0],
      ["La entrego en objetos perdidos", 1],
      ["Devuelvo la cartera, pero el dinero se queda conmigo", 2],
      ["Me quedo con todo y tiro la identificación", 3] ] },
    { tag: "El secreto", q: "Tu mejor amigo te cuenta un secreto bien jugoso.", a: [
      ["Soy una tumba", 0],
      ["Se lo cuento a una sola persona, y ya", 1],
      ["Lo suelto en la primera plática, sin mala intención", 2],
      ["Lo guardo para usarlo cuando me convenga", 3] ] },
    { tag: "La fila", q: "Alguien se te cuela en la fila del súper.", a: [
      ["Lo dejo pasar, tampoco es para tanto", 0],
      ["Suspiro bien fuerte", 1],
      ["Hago un comentario en voz alta para que todos escuchen", 2],
      ["Me le cuelo yo después, por justicia poética", 3] ] },
    { tag: "La comida", q: "Tu amiga cocinó con mucho cariño y la comida quedó incomible.", a: [
      ["Digo que está rica y me la acabo", 0],
      ["Le sugiero con tacto un poquito más de sal", 1],
      ["Dejo el plato casi intacto y ya", 2],
      ["Le digo la verdad, completa y frente a todos", 3] ] },
    { tag: "El audio", q: "Te mandan un audio de WhatsApp de cinco minutos.", a: [
      ["Lo escucho completo, con atención", 0],
      ["Lo escucho en velocidad 2x", 1],
      ["Pido que alguien me haga el resumen", 2],
      ["Respondo \"jajaja\" sin haberlo abierto", 3] ] },
    { tag: "El crédito", q: "Tu jefe felicita solo a ti por un proyecto que hicieron en equipo.", a: [
      ["Doy el crédito a todo el equipo", 0],
      ["Menciono al equipo rápido y cambio de tema", 1],
      ["Doy las gracias y no aclaro nada", 2],
      ["Me llevo todo el crédito y me siento ganador", 3] ] },
    { tag: "La tardanza", q: "Llegas tarde a una cita porque te quedaste dormido.", a: [
      ["Aviso y admito que me quedé dormido", 0],
      ["Digo que había mucho tráfico", 1],
      ["Invento una emergencia bien dramática", 2],
      ["Hago sentir culpable al otro por reclamarme", 3] ] },
    { tag: "Las bolsas", q: "Ves a un desconocido luchando con muchas bolsas pesadas.", a: [
      ["Le ayudo sin que me lo pida", 0],
      ["Le pregunto si necesita una mano", 1],
      ["Lo miro con lástima y sigo caminando", 2],
      ["Me río un poquito y lo grabo", 3] ] },
    { tag: "El negocio", q: "Un amigo te cuenta su idea de negocio y es malísima.", a: [
      ["Lo apoyo y le ayudo a mejorarla con cariño", 0],
      ["Le digo mis dudas con mucho tacto", 1],
      ["Le sonrío y me guardo el \"te lo dije\"", 2],
      ["Le digo que va a fracasar y luego lo cuento de chiste", 3] ] },
    { tag: "La pizza", q: "Queda el último pedazo de pizza en la mesa.", a: [
      ["Pregunto si alguien lo quiere", 0],
      ["Espero a que alguien más lo tome", 1],
      ["Lo agarro rápido antes de que se acabe", 2],
      ["Le doy una mordida para marcarlo como mío", 3] ] }
  ];

  var TIERS = [
    { max: 15, title: "Me caes demasiado bien", text: "Tan bien que ya me da sospecha. Siéntate en mi mesa cuando quieras; yo invito el último pedazo de pizza." },
    { max: 35, title: "Me caes bien, con asterisco", text: "Eres buena onda casi siempre. Hay uno o dos detalles que prefiero no investigar, y así estamos en paz." },
    { max: 55, title: "Ni fu ni fa", text: "Ni te adoro ni te evito. Si me invitas a algo, lo pienso. Si hay comida, lo pienso menos." },
    { max: 75, title: "Me caes medio gordo", text: "Todavía te saludo, pero la sonrisa me cuesta trabajo. Tus decisiones tienen opiniones divididas en el grupo." },
    { max: 100, title: "Villano de telenovela", text: "Cuando entras suena música dramática. Ya perdí la cuenta de tus escenas, pero hay que admitir que tienes carisma." }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var state = { name: "", idx: 0, answers: [], pct: 0, tier: null };

  // ---------- Medidor (SVG) ----------
  function polar(cx, cy, r, deg) {
    var t = deg * Math.PI / 180;
    return [cx + r * Math.cos(t), cy - r * Math.sin(t)];
  }
  function gaugeSVG(needleClass, label) {
    var colors = ["#1fa97a", "#8fd16a", "#ffb627", "#ff7a45", "#e5265f"];
    var paths = "";
    for (var i = 0; i < 5; i++) {
      var a0 = 180 - 36 * i - 1.8;
      var a1 = 180 - 36 * (i + 1) + 1.8;
      var p0 = polar(150, 150, 120, a0);
      var p1 = polar(150, 150, 120, a1);
      paths += '<path d="M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
        ' A120 120 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        '" fill="none" stroke="' + colors[i] + '" stroke-width="24"/>';
    }
    return '<svg class="gauge" viewBox="0 0 300 170" role="img" aria-label="' + label + '">' +
      paths +
      '<g class="needle ' + needleClass + '"><line x1="150" y1="150" x2="150" y2="48" stroke-width="6" stroke-linecap="round"/>' +
      '<circle cx="150" cy="150" r="11"/></g></svg>';
  }

  $("heroGauge").innerHTML = gaugeSVG("hero-needle", "Medidor de qué tan mal me caes");

  // ---------- Pantallas ----------
  function show(id) {
    ["start", "quiz", "result"].forEach(function (s) { $(s).hidden = (s !== id); });
    window.scrollTo(0, 0);
  }

  // ---------- Preguntas ----------
  function renderProgress() {
    var html = "";
    for (var i = 0; i < QUESTIONS.length; i++) {
      var cls = i < state.idx ? "done" : (i === state.idx ? "now" : "");
      html += '<i class="' + cls + '"></i>';
    }
    var p = $("progress");
    p.innerHTML = html;
    p.setAttribute("aria-valuenow", state.idx + 1);
    p.setAttribute("aria-valuetext", "Pregunta " + (state.idx + 1) + " de " + QUESTIONS.length);
  }

  function renderQuestion() {
    var q = QUESTIONS[state.idx];
    renderProgress();
    $("qtext").textContent = q.q;
    var ul = $("options");
    ul.innerHTML = "";
    q.a.forEach(function (opt, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (state.answers[state.idx] === i ? " picked" : "");
      b.textContent = opt[0];
      b.addEventListener("click", function () { choose(i, b); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    $("backBtn").hidden = state.idx === 0;
  }

  var locked = false;
  function choose(i, btn) {
    if (locked) return;
    locked = true;
    state.answers[state.idx] = i;
    var all = document.querySelectorAll(".opt");
    for (var k = 0; k < all.length; k++) all[k].classList.remove("picked");
    btn.classList.add("picked");
    setTimeout(function () {
      locked = false;
      if (state.idx < QUESTIONS.length - 1) {
        state.idx++;
        renderQuestion();
        $("qtext").focus({ preventScroll: true });
      } else {
        finish();
      }
    }, 260);
  }

  // ---------- Resultado ----------
  function finish() {
    var total = 0, max = QUESTIONS.length * 3;
    var red = [], green = [];
    QUESTIONS.forEach(function (q, i) {
      var pick = q.a[state.answers[i]];
      total += pick[1];
      if (pick[1] === 3) red.push({ tag: q.tag, text: pick[0] });
      if (pick[1] === 0) green.push({ tag: q.tag, text: pick[0] });
    });
    state.pct = Math.round(total / max * 100);
    state.tier = TIERS.filter(function (t) { return state.pct <= t.max; })[0];

    show("result");
    $("resultGauge").innerHTML = gaugeSVG("result-needle", "Resultado: te caigo mal en un " + state.pct + " por ciento");

    var name = state.name ? state.name + ", " : "";
    $("verdict").textContent = name + state.tier.title.charAt(0).toLowerCase() + state.tier.title.slice(1);
    if (!state.name) $("verdict").textContent = state.tier.title;
    $("roast").textContent = state.tier.text;

    fillList("redFlags", "redList", red.slice(0, 3), "Ninguna bandera roja. Raro, pero te lo reconozco.");
    fillList("greenFlags", "greenList", green.slice(0, 3));
    $("redFlags").hidden = red.length === 0;
    $("greenFlags").hidden = green.length === 0;
    $("status").textContent = "";

    // Animar aguja y número
    var needle = document.querySelector(".result-needle");
    var angle = -90 + state.pct * 1.8;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { needle.style.transform = "rotate(" + angle + "deg)"; });
    });
    countUp(state.pct, reduce ? 0 : 1600);
    $("verdict").focus({ preventScroll: true });
  }

  function fillList(boxId, listId, items) {
    var ul = $(listId);
    ul.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      var b = document.createElement("b");
      b.textContent = it.tag + ": ";
      li.appendChild(b);
      li.appendChild(document.createTextNode(it.text));
      ul.appendChild(li);
    });
  }

  function countUp(target, duration) {
    var el = $("pct");
    function set(n) { el.innerHTML = n + "<small>%</small>"; }
    if (!duration) { set(target); return; }
    var start = null;
    function step(ts) {
      if (start === null) start = ts;
      var t = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - t, 3);
      set(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- Acciones ----------
  $("startBtn").addEventListener("click", function () {
    state.name = $("nameInput").value.trim();
    state.idx = 0;
    state.answers = [];
    show("quiz");
    renderQuestion();
    $("qtext").focus({ preventScroll: true });
  });
  $("nameInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("startBtn").click();
  });
  $("backBtn").addEventListener("click", function () {
    if (state.idx > 0) { state.idx--; renderQuestion(); }
  });
  $("retryBtn").addEventListener("click", function () {
    show("start");
    $("heroGauge").innerHTML = gaugeSVG("hero-needle", "Medidor de qué tan mal me caes");
  });
  $("copyBtn").addEventListener("click", function () {
    var who = state.name ? state.name + ": " : "";
    var text = who + "Me caes " + state.pct + "% mal. Veredicto: " + state.tier.title + ". ¿Y tú, qué tan mal me caes?";
    var ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { $("status").textContent = "Copiado. Ya puedes pegarlo donde quieras."; },
          function () { fallback(text); });
        return;
      }
    } catch (e) {}
    fallback(text);
  });
  function fallback(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    $("status").textContent = ok ? "Copiado. Ya puedes pegarlo donde quieras." : "No pude copiarlo. Tu resultado: " + text;
  }
})();
</script>
</body>
</html>
